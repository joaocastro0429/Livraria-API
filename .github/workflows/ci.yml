name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        run: bash mvnw --batch-mode verify
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: livraria_test
          POSTGRES_USER: livraria_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livraria_test -d livraria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify with isolated PostgreSQL
        run: >-
          bash mvnw --batch-mode verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/livraria_test
          -Dspring.datasource.username=livraria_test
          -Dspring.datasource.password=test_only_password
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
